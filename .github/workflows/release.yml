name: Package release
on:
  push:
    branches: [main]
    paths: ['Info.plist']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ambience-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'NigelTatem/ambience'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Build universal app and verify signed update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash scripts/package-release.sh
      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Ambience $version" --notes-file RELEASE-NOTES.md
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Ambience $version" --notes-file RELEASE-NOTES.md
          fi
          gh release upload "$tag" "dist/Ambience-$version.dmg" "dist/Ambience-$version.zip" dist/appcast.xml dist/SHA256SUMS.txt --clobber
          echo "Release $tag is published with its signed update feed."
