name: Build and check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and run model checks
        run: bash scripts/build-app.sh
